<!doctype html><html lang="cs"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080b10"><link rel="manifest" href="manifest.webmanifest">
<title>TowBrüx Driver</title>
<style>
:root{--bg:#080b10;--p:#111720;--p2:#18212c;--t:#f5f7fa;--m:#9ba7b6;--l:#29333f;--g:#f5b900;--b:#2f6df6;--ok:#20b26b}
*{box-sizing:border-box}body{margin:0;background:#020408;color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.app{max-width:560px;margin:auto;min-height:100vh;background:linear-gradient(#080b10,#0b1017)}
header{position:sticky;top:0;z-index:5;background:#080b10ee;border-bottom:1px solid var(--l);padding:12px 15px}.brand{display:flex;align-items:center;gap:10px}.logo{width:46px;height:46px}.brand b{font-size:20px}.brand b span{color:var(--g)}.sub,.small{font-size:12px;color:var(--m)}main{padding:14px 14px 90px}.card{background:var(--p);border:1px solid var(--l);border-radius:18px;padding:15px;margin-bottom:12px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.ey{font-size:11px;color:var(--m);font-weight:800;text-transform:uppercase;letter-spacing:.08em}.job{font-size:20px;font-weight:900}.badge{padding:7px 10px;border-radius:99px;background:#302608;color:#ffd84d;font-size:11px;font-weight:900}.label{font-size:12px;color:var(--m);font-weight:800;margin-bottom:5px}.addr{font-size:18px;font-weight:850;line-height:1.3}.note{line-height:1.45;color:#dce2e9}button{width:100%;border:0;border-radius:14px;padding:14px 12px;margin-top:9px;font-weight:900;font-size:15px}.gold{background:var(--g);color:#111}.dark{background:#202a36;color:#fff;border:1px solid #34404d}.blue{background:var(--b);color:#fff}.green{background:var(--ok);color:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.grid button{margin:0}.kpi{display:grid;grid-template-columns:1fr 1fr;gap:9px}.box{background:var(--p2);border:1px solid var(--l);border-radius:14px;padding:12px}.num{font-size:24px;font-weight:900}.step{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--l)}.step:last-child{border:0}.dot{width:12px;height:12px;border-radius:50%;background:#3a4552;margin-top:4px;flex:none}.dot.on{background:var(--ok)}.dot.cur{background:var(--g)}.empty{text-align:center;padding:42px 18px;color:var(--m)}.big{font-size:45px}.view{display:none}.view.active{display:block}nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(560px,100%);background:#080b10f5;border-top:1px solid var(--l);padding:7px 10px calc(7px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(3,1fr);z-index:10}nav button{background:transparent;color:var(--m);margin:0;font-size:11px;padding:7px}nav button.active{color:var(--g)}.ico{display:block;font-size:20px}.toast{position:fixed;z-index:20;left:50%;bottom:85px;transform:translate(-50%,10px);opacity:0;background:#f5f7fa;color:#10151c;padding:11px 15px;border-radius:99px;font-size:13px;font-weight:800;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
input{width:100%;background:var(--p2);border:1px solid var(--l);border-radius:12px;padding:13px;color:white;margin-bottom:9px;outline:none}
</style></head><body><div class="app">
<header><div class="brand"><img src="icon.svg" class="logo"><div><b>Tow<span>Brüx</span> Driver</b><div class="sub">Aplikace pro řidiče</div></div></div></header>
<main>
<section id="home" class="view active"><div id="jobArea"></div>
<div class="card"><div class="row"><div><div class="ey">Dnešní přehled</div><div class="job">Moje směna</div></div><span id="shift" class="badge">PŘIPRAVEN</span></div>
<div class="kpi" style="margin-top:12px"><div class="box"><div id="active" class="num">0</div><div class="small">Aktivní zakázky</div></div><div class="box"><div id="done" class="num">0</div><div class="small">Dokončeno</div></div></div></div>
<div class="card"><div class="label">🔔 Stav řidiče</div><div class="grid"><button class="dark" onclick="state('DOSTUPNÝ')">🟢 Dostupný</button><button class="dark" onclick="state('ZANEPRÁZDNĚN')">🟠 Zaneprázdněn</button></div></div></section>
<section id="history" class="view"><div class="card"><h2>📋 Historie zakázek</h2><div id="hist"></div></div></section>
<section id="profile" class="view"><div class="card"><h2>👤 Profil řidiče</h2><input id="name" placeholder="Jméno řidiče"><input id="car" placeholder="Vozidlo / SPZ"><button class="gold" onclick="saveProfile()">Uložit profil</button></div>
<div class="card"><h2>⚙️ Nastavení</h2><button class="dark" onclick="demo()">➕ Načíst testovací zakázku</button><button class="dark" onclick="clearData()">🗑️ Vymazat lokální data</button><p class="small">TowBrüx Driver 1.0 • připraveno pro budoucí propojení s TowBrüx Dispatch.</p></div></section>
</main>
<nav><button class="active" onclick="show('home',this)"><span class="ico">🏠</span>Zakázka</button><button onclick="show('history',this)"><span class="ico">📋</span>Historie</button><button onclick="show('profile',this)"><span class="ico">👤</span>Profil</button></nav><div id="toast" class="toast"></div>
<script>
const K="tb_job",H="tb_hist",P="tb_profile";const S=[["new","NOVÁ","📨 Čeká na přijetí"],["accepted","PŘIJATA","🟢 Zakázka přijata"],["enroute","VYRAZIL","🚚 Řidič vyrazil"],["onsite","NA MÍSTĚ","📍 Řidič je na místě"],["service","V SERVISU","🔧 Vozidlo je v servisu"],["done","DOKONČENA","✅ Zakázka dokončena"]];
const job=()=>JSON.parse(localStorage.getItem(K)||"null"),hist=()=>JSON.parse(localStorage.getItem(H)||"[]");
function esc(x){return String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function toast(x){let t=document.getElementById("toast");t.textContent=x;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2000)}
function show(id,b){document.querySelectorAll(".view").forEach(x=>x.classList.remove("active"));document.getElementById(id).classList.add("active");document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));if(b)b.classList.add("active");if(id==="history")renderHist()}
function render(){let j=job(),a=document.getElementById("jobArea");a.innerHTML=j?jobHtml(j):'<div class="card empty"><div class="big">📭</div><h2>Žádná aktivní zakázka</h2><div>Jakmile dispečer odešle zakázku, zobrazí se zde.</div></div>';document.getElementById("active").textContent=j&&j.status!=="done"?1:0;document.getElementById("done").textContent=hist().length}
function jobHtml(j){let ix=S.findIndex(x=>x[0]===j.status);let st=S[ix]||S[0];let buttons=j.status==="new"?'<button class="gold" onclick="setStatus(\'accepted\')">✅ PŘIJMOUT ZAKÁZKU</button>':j.status==="done"?"":'<div class="grid"><button class="dark" onclick="setStatus(\'enroute\')">🚚 VYRAZIL JSEM</button><button class="blue" onclick="setStatus(\'onsite\')">📍 JSEM NA MÍSTĚ</button><button class="dark" onclick="setStatus(\'service\')">🔧 V SERVISU</button><button class="green" onclick="setStatus(\'done\')">✅ DOKONČENO</button></div>';
return '<div class="card"><div class="row"><div><div class="ey">Zakázka</div><div class="job">'+esc(j.id)+'</div></div><span class="badge">'+st[1]+'</span></div></div><div class="card"><div class="label">📍 Zásah klienta</div><div class="addr">'+esc(j.impact)+'</div><button class="dark" onclick="navTo('+JSON.stringify(j.impact)+')">🧭 Navigovat k zásahu</button></div><div class="card"><div class="label">🔧 Servis klienta</div><div class="addr">'+esc(j.service)+'</div><button class="dark" onclick="navTo('+JSON.stringify(j.service)+')">🧭 Navigovat do servisu</button></div><div class="card"><div class="label">📝 Poznámka dispečera</div><div class="note">'+esc(j.note||"Bez poznámky")+'</div>'+buttons+'</div><div class="card"><div class="label">Průběh zakázky</div>'+S.map((s,i)=>'<div class="step"><div class="dot '+(i<ix?"on":i===ix?"cur":"")+'"></div><div><b>'+s[1]+'</b><div class="small">'+esc(j.times?.[s[0]]||s[2])+'</div></div></div>').join("")+'</div>'}
function setStatus(s){let j=job();if(!j)return;let now=S.findIndex(x=>x[0]===s),cur=S.findIndex(x=>x[0]===j.status);if(now<cur)return;j.status=s;j.times=j.times||{};j.times[s]=new Date().toLocaleString("cs-CZ");if(s==="done"){let h=hist();h.unshift(j);localStorage.setItem(H,JSON.stringify(h));localStorage.removeItem(K);toast("Zakázka dokončena")}else{localStorage.setItem(K,JSON.stringify(j));toast(S[now][1])}render()}
function navTo(a){location.href="https://www.google.com/maps/dir/?api=1&destination="+encodeURIComponent(a)}
function demo(){localStorage.setItem(K,JSON.stringify({id:"TB-2026-001",impact:"Most, ulice J. Palacha",service:"Hlavní 88, Větrušice",note:"Zákazník čeká na místě. Po naložení pokračovat do servisu.",status:"new",times:{}}));toast("Testovací zakázka načtena");render();show("home",document.querySelector("nav button"))}
function renderHist(){let h=hist();document.getElementById("hist").innerHTML=h.length?h.map(j=>'<div class="step"><div class="dot on"></div><div><b>'+esc(j.id)+'</b><div>'+esc(j.impact)+'</div><div class="small">Servis: '+esc(j.service)+' • '+esc(j.times?.done||"")+'</div></div></div>').join(""):'<div class="empty">Zatím žádná dokončená zakázka.</div>'}
function state(x){document.getElementById("shift").textContent=x;toast("Stav: "+x)}
function saveProfile(){localStorage.setItem(P,JSON.stringify({name:name.value,car:car.value}));toast("Profil uložen")}
function clearData(){if(confirm("Vymazat lokální data?")){localStorage.clear();render();toast("Data vymazána")}}
let p=JSON.parse(localStorage.getItem(P)||"{}");name.value=p.name||"";car.value=p.car||"";render();
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></div></body></html>
