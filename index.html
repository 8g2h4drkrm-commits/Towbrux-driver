<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080b10">
<link rel="manifest" href="manifest.webmanifest">
<title>TowBrüx Driver</title>

<style>
:root{
  --p:#111720;
  --p2:#18212c;
  --t:#f5f7fa;
  --m:#9ba7b6;
  --l:#29333f;
  --g:#f5b900;
  --b:#2f6df6;
  --ok:#20b26b;
  --bad:#e5484d
}

*{box-sizing:border-box}

body{
  margin:0;
  background:#020408;
  color:var(--t);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif
}

.app{
  max-width:560px;
  margin:auto;
  min-height:100vh;
  background:linear-gradient(#080b10,#0b1017)
}

header{
  position:sticky;
  top:0;
  z-index:5;
  background:#080b10ee;
  border-bottom:1px solid var(--l);
  padding:14px 15px
}

.brand{
  display:flex;
  align-items:center;
  gap:10px
}

.logo{
  width:46px;
  height:46px
}

.brand b{
  font-size:20px
}

.brand b span{
  color:var(--g)
}

.sub,.small{
  font-size:12px;
  color:var(--m)
}

main{
  padding:14px 14px 100px
}

.card{
  background:var(--p);
  border:1px solid var(--l);
  border-radius:18px;
  padding:15px;
  margin-bottom:12px
}

.row{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:center
}

.ey{
  font-size:11px;
  color:var(--m);
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.08em
}

.job{
  font-size:20px;
  font-weight:900
}

.badge{
  padding:7px 10px;
  border-radius:99px;
  background:#302608;
  color:#ffd84d;
  font-size:11px;
  font-weight:900
}

.label{
  font-size:12px;
  color:var(--m);
  font-weight:800;
  margin-bottom:5px
}

.addr{
  font-size:18px;
  font-weight:850;
  line-height:1.3
}

.note{
  line-height:1.45;
  color:#dce2e9
}

button{
  width:100%;
  border:0;
  border-radius:14px;
  padding:14px 12px;
  margin-top:9px;
  font-weight:900;
  font-size:15px
}

.gold{
  background:var(--g);
  color:#111
}

.dark{
  background:#202a36;
  color:#fff;
  border:1px solid #34404d
}

.blue{
  background:var(--b);
  color:#fff
}

.green{
  background:var(--ok);
  color:#fff
}

.red{
  background:var(--bad);
  color:#fff
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px
}

.grid button{
  margin:0
}

.kpi{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px
}

.box{
  background:var(--p2);
  border:1px solid var(--l);
  border-radius:14px;
  padding:12px
}

.num{
  font-size:24px;
  font-weight:900
}

.step{
  display:flex;
  gap:10px;
  padding:10px 0;
  border-bottom:1px solid var(--l)
}

.step:last-child{
  border:0
}

.dot{
  width:12px;
  height:12px;
  border-radius:50%;
  background:#3a4552;
  margin-top:4px;
  flex:none
}

.dot.on{
  background:var(--ok)
}

.dot.cur{
  background:var(--g)
}

.empty{
  text-align:center;
  padding:42px 18px;
  color:var(--m)
}

.big{
  font-size:45px
}

.view{
  display:none
}

.view.active{
  display:block
}

nav{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:min(560px,100%);
  background:#080b10f5;
  border-top:1px solid var(--l);
  padding:7px 10px calc(7px + env(safe-area-inset-bottom));
  display:grid;
  grid-template-columns:repeat(3,1fr);
  z-index:10
}

nav button{
  background:transparent;
  color:var(--m);
  margin:0;
  font-size:11px;
  padding:7px
}

nav button.active{
  color:var(--g)
}

.ico{
  display:block;
  font-size:20px
}

.toast{
  position:fixed;
  z-index:20;
  left:50%;
  bottom:85px;
  transform:translate(-50%,10px);
  opacity:0;
